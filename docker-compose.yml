version: "3.9"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cop_app
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - prometheus
      - loki    
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: cop_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: cop_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.10.0
    container_name: cop_loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.10.0
    container_name: cop_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - ./app/logs:/app/logs
      - promtail-positions:/tmp
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cop_jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "6831:6831/udp"
      - "6832:6832/udp"
    restart: unless-stopped

volumes:
  grafana-storage:
  loki-data:
  promtail-positions:

